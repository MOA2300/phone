<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Interactive Flip Phone</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="phone-stage">

    <!-- Small animated phone shown before opening -->
    <button
      id="sprite-button"
      class="sprite-button"
      type="button"
      aria-label="Open phone"
    >
      <img
        id="sprite"
        src="DefineSprite_22/1.png"
        alt="Small animated phone"
        draggable="false"
      >
    </button>

    <!-- Main interactive phone -->
    <section
      id="phone-container"
      class="phone-container"
      aria-label="Interactive flip phone"
    >
      <!-- Phone animation frame -->
      <img
        id="phone-frame"
        src="images/6.png"
        alt="Interactive flip phone"
        draggable="false"
      >

      <!-- Bunny image on the closed phone display -->
      <div
        id="front-screen"
        class="front-screen"
        aria-hidden="true"
      >
        <img
          id="front-screen-image"
          src="images/bunny.png"
          alt="Pixel bunny"
          draggable="false"
        >
      </div>

      <!-- JavaScript adds the clickable keypad buttons here -->
      <div
        id="key-overlay"
        class="key-overlay"
        aria-hidden="true"
      ></div>

      <!-- Clickable area for closing and reopening the phone -->
      <button
        id="flip-trigger"
        class="flip-trigger"
        type="button"
        aria-label="Close phone"
      ></button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
