<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Leslie Ahuatzi | Creative Application</title>

  <link rel="stylesheet" href="style.css" />

  <script src="script.js" defer></script>
</head>

<body>
  <main class="phone-stage">

    <!-- Starting animated phone -->
    <button
      id="sprite-button"
      class="sprite-button"
      type="button"
      aria-label="Open Leslie's phone"
    >
      <img
        id="sprite"
        src="DefineSprite_22/1.png"
        alt=""
      />
    </button>

    <!-- Main phone -->
    <section
      id="phone-container"
      class="phone-container"
      aria-label="Interactive flip phone portfolio"
    >
      <img
        id="phone-frame"
        src="images/6.png"
        alt="Interactive flip phone"
      />

      <!-- Open phone date and time -->
      <div
        id="open-screen-clock"
        class="open-screen-clock"
        aria-hidden="true"
      >
        <div
          id="open-screen-date"
          class="open-screen-date"
        ></div>

        <div
          id="open-screen-time"
          class="open-screen-time"
        ></div>
      </div>

      <!-- Phone menu -->
      <section
        id="phone-menu"
        class="phone-menu"
        aria-label="Portfolio menu"
        aria-hidden="true"
      >
        <p class="phone-menu-heading">MAIN MENU</p>

        <div class="phone-menu-grid">

          <button
            class="phone-menu-item is-selected"
            type="button"
            data-section="about"
            data-menu-index="0"
          >
            <span class="menu-icon menu-icon-about">
              <span></span>
            </span>

            <span>ABOUT</span>
          </button>

          <button
            class="phone-menu-item"
            type="button"
            data-section="site"
            data-menu-index="1"
          >
            <span class="menu-icon menu-icon-site">
              <span></span>
            </span>

            <span>SITE</span>
          </button>

          <button
            class="phone-menu-item"
            type="button"
            data-section="history"
            data-menu-index="2"
          >
            <span class="menu-icon menu-icon-history">
              <span></span>
            </span>

            <span>HISTORY</span>
          </button>

          <button
            class="phone-menu-item"
            type="button"
            data-section="resume"
            data-menu-index="3"
          >
            <span class="menu-icon menu-icon-resume">
              <span></span>
            </span>

            <span>RESUME</span>
          </button>

        </div>

        <p class="phone-menu-instruction">
          ▲▼◀▶ MOVE · CENTER SELECT
        </p>
      </section>

      <!-- Closed-phone bunny screen -->
      <div
        id="front-screen"
        class="front-screen"
        aria-hidden="true"
      >
        <img
          id="front-screen-image"
          src="images/bunny.png"
          alt=""
        />

        <div class="front-screen-clock">
          <div
            id="front-screen-date"
            class="front-screen-date"
          ></div>

          <div
            id="front-screen-time"
            class="front-screen-time"
          ></div>
        </div>
      </div>

      <!-- Invisible keypad buttons generated by JS -->
      <div
        id="key-overlay"
        class="key-overlay"
        aria-hidden="true"
      ></div>

      <!-- Close/reopen phone trigger -->
      <button
        id="flip-trigger"
        class="flip-trigger"
        type="button"
        aria-label="Close phone"
      ></button>
    </section>

    <!-- Sliding content panel -->
    <aside
      id="content-panel"
      class="content-panel"
      aria-hidden="true"
    >
      <div class="content-panel-edge"></div>

      <header class="content-panel-header">
        <div>
          <p class="content-panel-label">
            LESLIE.AHUATZI.EXE
          </p>

          <h1 id="panel-title">ABOUT</h1>
        </div>

        <button
          id="panel-close"
          class="panel-close"
          type="button"
          aria-label="Close section"
        >
          ×
        </button>
      </header>

      <div class="content-panel-body">

        <button
          id="panel-previous"
          class="panel-arrow panel-arrow-left"
          type="button"
          aria-label="Previous page"
        >
          ‹
        </button>

        <article
          id="panel-page"
          class="panel-page"
          aria-live="polite"
        ></article>

        <button
          id="panel-next"
          class="panel-arrow panel-arrow-right"
          type="button"
          aria-label="Next page"
        >
          ›
        </button>

      </div>

      <footer class="content-panel-footer">
        <span id="panel-page-number">01 / 01</span>

        <span>USE ◀ ▶ TO EXPLORE</span>
      </footer>
    </aside>

  </main>
</body>
</html>
