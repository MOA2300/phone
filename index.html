<!-- Intro instructions -->
<img
  id="instruction-text"
  class="instruction-text"
  src="images/instructiontext.png"
  alt="Click anywhere on the phone to interact"
/>

<!--
  Starts by displaying “Turn audio on.”
  audioon.png must be the image that says Turn audio on.
-->
<button
  id="audio-toggle"
  class="audio-toggle"
  type="button"
  aria-label="Turn phone ringing audio on"
  aria-pressed="false"
>
  <img
    id="audio-toggle-image"
    class="audio-toggle-image"
    src="images/audioon.png"
    alt="Turn audio on"
  />
</button>

<!-- Animated miniature phone -->
<button
  id="sprite-button"
  class="sprite-button"
  type="button"
  aria-label="Open Leslie's interactive phone"
>
  <img
    id="sprite"
    src="DefineSprite_22/1.png"
    alt=""
  />
</button>
